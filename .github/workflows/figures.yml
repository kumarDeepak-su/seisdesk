name: figures

on:
  workflow_dispatch:

jobs:
  figures:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-windows.txt
          python -m pip install --no-deps -e .

      - name: Make figures
        run: python tools/make_figures.py figures

      - name: Manual screenshots
        if: always()
        run: python tools/manual_screenshots.py figures/manual

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seisdesk-figures
          path: figures/
