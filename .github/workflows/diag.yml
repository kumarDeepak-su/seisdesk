name: render-diagnostic

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        combo:
          - "PySide6==6.9.1 pyqtgraph==0.14.0"
          - "PySide6==6.9.1 pyqtgraph==0.13.7"
          - "PySide6==6.8.3 pyqtgraph==0.14.0"
          - "PySide6==6.7.3 pyqtgraph==0.13.7"
          - "PySide6==6.10.2 pyqtgraph==0.14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install numpy==2.2.6 ${{ matrix.combo }}
      - name: Diagnose
        run: python tools/diag_render.py diag
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-${{ strategy.job-index }}
          path: diag/
